services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vistorias-api
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - web
    # Sem "ports": a API só é acessível internamente pelo Caddy via rede Docker

networks:
  web:
    external: true
